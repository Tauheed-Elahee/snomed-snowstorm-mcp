name: Deploy to Azure Functions

# Consultologist-Blazor#403: the server attests its build. The commit is
# stamped into AssemblyInformationalVersion and served at
# GET /api/Public/Terminology, so a job record can name the server that
# served it. Before this the app was deployed by hand (docs/setup.md § 3,
# kept as the fallback).
#
# Consultologist-Blazor#722: release-driven deploy. The server ships from a
# published GitHub Release, so production is always a known release and a job
# record links the release the terminology server was deployed from. The
# release tag is stamped beside the commit and served as Release. A manual
# workflow_dispatch carries no tag — the build then stamps only the commit.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: consultologist-snomed-mcp-flex
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build, stamped with the commit and release
        # The release tag through an env var, not inline, so a tag string cannot
        # inject into the build line. Empty on a manual workflow_dispatch — the
        # csproj then stamps no release and the server reports the commit alone.
        env:
          SNOMED_RELEASE: ${{ github.event.release.tag_name }}
        run: dotnet build --configuration Release --output ./output -p:SourceRevisionId=${{ github.sha }} -p:SnomedRelease="$SNOMED_RELEASE" -p:ContinuousIntegrationBuild=true

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@bc63708cc6539760eea18d8a7de4ce8ef5fdf593 # v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
          sku: flexconsumption

      - name: The server attests the commit and release just deployed
        # The tag rides an env var (injection guard); empty on workflow_dispatch,
        # where only the commit is checked.
        env:
          EXPECTED_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sleep 60
          for attempt in 1 2 3 4 5 6; do
            if BODY=$(curl -sf --max-time 20 https://mcp.snomed.consultologist.ai/api/Public/Terminology); then
              COMMIT=$(echo "$BODY" | python3 -c 'import json,sys;print(json.load(sys.stdin)["Commit"])')
              RELEASE=$(echo "$BODY" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("Release") or "")')
              if [ "$COMMIT" = "${{ github.sha }}" ] && { [ -z "$EXPECTED_RELEASE" ] || [ "$RELEASE" = "$EXPECTED_RELEASE" ]; }; then
                echo "attested commit $COMMIT release ${RELEASE:-—}"; exit 0
              fi
              echo "attests $COMMIT / ${RELEASE:-—}, waiting for ${{ github.sha }} / ${EXPECTED_RELEASE:-—}"
            fi
            sleep 30
          done
          echo "::error::the deployed server does not attest ${{ github.sha }} / ${EXPECTED_RELEASE:-—}"
          exit 1
