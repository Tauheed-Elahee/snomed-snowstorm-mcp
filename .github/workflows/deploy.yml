name: Deploy to Azure Functions

# Consultologist-Blazor#403: the server attests its build. The commit is
# stamped into AssemblyInformationalVersion and served at
# GET /api/Public/Terminology, so a job record can name the server that
# served it. Before this the app was deployed by hand (docs/setup.md § 3,
# kept as the fallback).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: consultologist-snomed-mcp-flex
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build, stamped with the commit
        run: dotnet build --configuration Release --output ./output -p:SourceRevisionId=${{ github.sha }} -p:ContinuousIntegrationBuild=true

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: Azure/functions-action@bc63708cc6539760eea18d8a7de4ce8ef5fdf593 # v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
          sku: flexconsumption

      - name: The server attests the commit just deployed
        run: |
          set -euo pipefail
          sleep 60
          for attempt in 1 2 3 4 5 6; do
            if COMMIT=$(curl -sf --max-time 20 https://mcp.snomed.consultologist.ai/api/Public/Terminology | python3 -c 'import json,sys;print(json.load(sys.stdin)["Commit"])'); then
              if [ "$COMMIT" = "${{ github.sha }}" ]; then echo "attested $COMMIT"; exit 0; fi
              echo "attests $COMMIT, waiting for ${{ github.sha }}"
            fi
            sleep 30
          done
          echo "::error::the deployed server does not attest ${{ github.sha }}"
          exit 1
